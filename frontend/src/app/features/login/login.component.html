<div class="d-flex align-items-center justify-content-center min-vh-100 px-3">
  <div class="card shadow-sm" style="max-width: 420px; width: 100%;">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3">
          <i class="bi bi-check2-square"></i>
        </div>
        <h1 class="h4 fw-bold mb-1">TaskFlow</h1>
        <p class="text-muted small mb-0">Connectez-vous à votre compte</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label class="form-label small fw-semibold" for="email">Email</label>
          <input
            id="email"
            type="email"
            class="form-control"
            formControlName="email"
            placeholder="vous&#64;exemple.com"
            [class.is-invalid]="form.controls.email.invalid && form.controls.email.touched"
          />
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold" for="password">Mot de passe</label>
          <input
            id="password"
            type="password"
            class="form-control"
            formControlName="password"
            placeholder="••••••••"
            [class.is-invalid]="form.controls.password.invalid && form.controls.password.touched"
          />
        </div>

        @if (errorMessage()) {
          <div class="alert alert-danger py-2 small" role="alert">{{ errorMessage() }}</div>
        }

        <button type="submit" class="btn btn-primary w-100 fw-semibold" [disabled]="form.invalid || loading()">
          @if (loading()) {
            <span class="spinner-border spinner-border-sm me-2" role="status"></span>
          }
          {{ loading() ? 'Connexion...' : 'Se connecter' }}
        </button>

        <p class="text-center small text-muted mt-3 mb-0">
          Pas encore de compte ?
          <a routerLink="/register" class="text-primary text-decoration-none fw-semibold">Créer un compte</a>
        </p>
      </form>
    </div>
  </div>
</div>
